[package]
name = "voxel_game_engine"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "voxel_game_engine"
path = "src/lib.rs"
test = false

[[bin]]
name = "voxel_game_engine"
path = "src/main.rs"
test = false

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[dependencies]
bevy = "0.20"
bevy_egui = "0.43"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"

[build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"